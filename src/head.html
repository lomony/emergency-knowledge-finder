<title>Emergency Knowledge Finder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Music&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
:root{
  /* Layout: one reading column (max 1080px) under a masthead band and tab rail; the answer is the one framed object */
  --paper:#F3F5F4; --surface:#FFFFFF; --ink:#17212A; --muted:#55626D; --rule:#D6DCDF; --rule-strong:#B9C3C8;
  --accent:#1D6A65; --accent-ink:#FFFFFF; --accent-soft:#E0EEEC;
  --ok:#2A7549; --ok-soft:#E2F0E7; --warn:#875F00; --warn-soft:#F7EDD2; --old:#5F6B76; --old-soft:#E8ECEE; --calc:#44479A; --calc-soft:#E5E6F5; --stop:#8A3838; --stop-soft:#F4E3E2;
  --f-display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#10161A; --surface:#182026; --ink:#E3E9ED; --muted:#9AA7B1; --rule:#2A343B; --rule-strong:#3B4750;
  --accent:#5DB3AB; --accent-ink:#0C1918; --accent-soft:#15302E;
  --ok:#72C292; --ok-soft:#163021; --warn:#E2B54F; --warn-soft:#33290E; --old:#A1ABB4; --old-soft:#232B31; --calc:#A5A8F1; --calc-soft:#24264E; --stop:#E59191; --stop-soft:#391F1F;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#10161A; --surface:#182026; --ink:#E3E9ED; --muted:#9AA7B1; --rule:#2A343B; --rule-strong:#3B4750;
  --accent:#5DB3AB; --accent-ink:#0C1918; --accent-soft:#15302E;
  --ok:#72C292; --ok-soft:#163021; --warn:#E2B54F; --warn-soft:#33290E; --old:#A1ABB4; --old-soft:#232B31; --calc:#A5A8F1; --calc-soft:#24264E; --stop:#E59191; --stop-soft:#391F1F;
  color-scheme:dark; }
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.55;}
.wrap{max-width:1080px; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
.mast{background:var(--surface); border-bottom:1px solid var(--rule);}
.mast-in{padding-block:28px 22px; display:flex; flex-wrap:wrap; gap:16px 32px; align-items:flex-end; justify-content:space-between;}
.brand{min-width:0; flex:1 1 480px;}
h1{font-family:var(--f-display); font-weight:600; font-size:clamp(28px, 4.2vw, 40px); line-height:1.1; margin:6px 0 8px; text-wrap:balance; letter-spacing:-0.01em;}
.eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:0;}
.tag{margin:0; color:var(--muted); max-width:62ch;}
.mast-meta{display:flex; flex-wrap:wrap; gap:8px;}
.chip{font-family:var(--f-mono); font-size:12px; color:var(--muted); border:1px solid var(--rule); border-radius:999px; padding:4px 10px; background:var(--paper);}
.tabs{display:flex; gap:2px; overflow-x:auto; border-bottom:1px solid var(--rule); margin-top:6px;}
.tab{font:500 14px var(--f-body); color:var(--muted); background:none; border:0; border-bottom:2px solid transparent; padding:12px 14px 10px; cursor:pointer; white-space:nowrap;}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent);}
.tab:hover{color:var(--ink);}
main{padding-block:24px 48px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}
.lbl{display:block; font-weight:600; margin-bottom:8px;}
.ask-row{display:flex; gap:8px; flex-wrap:wrap;}
#q{flex:1 1 320px; min-width:0; font:inherit; font-size:16px; padding:12px 14px; border:1px solid var(--rule-strong); border-radius:8px; background:var(--surface); color:var(--ink);}
.btn{font:600 14px var(--f-body); background:var(--accent); color:var(--accent-ink); border:0; border-radius:8px; padding:12px 18px; cursor:pointer;}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent); padding:8px 14px;}
.chips{display:flex; flex-wrap:wrap; gap:8px; margin:14px 0 22px;}
.chips button{font:500 13px var(--f-body); color:var(--ink); background:var(--surface); border:1px solid var(--rule); border-radius:999px; padding:6px 12px; cursor:pointer;}
.chips button:hover{border-color:var(--accent); color:var(--accent);}
.answer{background:var(--surface); border:1px solid var(--rule); border-radius:12px; padding:22px clamp(16px, 3vw, 28px); max-width:820px;}
.ans-top{display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:10px;}
.q-echo{color:var(--muted); font-size:14px; min-width:0;}
.ans-title{font-family:var(--f-display); font-weight:600; font-size:21px; line-height:1.25; margin:8px 0 6px; text-wrap:balance;}
.lead{font-size:17px; margin:6px 0 12px; max-width:68ch;}
.body{margin:4px 0 12px; max-width:68ch;}
.premise{background:var(--warn-soft); border-radius:8px; padding:10px 12px; margin:0 0 12px; max-width:70ch;}
.pill{display:inline-flex; align-items:center; font:600 12px var(--f-body); padding:3px 10px; border-radius:999px; white-space:nowrap;}
.pill.ok{background:var(--ok-soft); color:var(--ok);} .pill.warn{background:var(--warn-soft); color:var(--warn);} .pill.old{background:var(--old-soft); color:var(--old);} .pill.calc{background:var(--calc-soft); color:var(--calc);} .pill.stop{background:var(--stop-soft); color:var(--stop);}
.meta{display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:12px 20px; margin:14px 0; padding:14px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);}
.meta div{min-width:0;} .meta dt{font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;} .meta dd{margin:0;}
.src{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;} .loc{color:var(--muted); font-size:13px;}
.ref{font-family:var(--f-mono); font-size:12px; font-weight:500; background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:4px; text-decoration:none; white-space:nowrap;}
a.ref:hover, a.plain:hover{text-decoration:underline;} a.plain{color:var(--ink); text-decoration:none;}
.note,.flag,.calc-note{margin:10px 0; padding:10px 12px; border-radius:8px; max-width:72ch;}
.note{background:var(--paper);} .flag{background:var(--warn-soft);} .calc-note{background:var(--calc-soft);}
.note-k{display:block; font-size:11.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:2px;}
.mini{border:1px solid var(--rule); border-radius:8px; padding:10px 12px; margin:10px 0; background:var(--paper);}
.mini-h{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:4px;} .asof{font-size:13px; color:var(--muted);} .mini-t{margin:4px 0;} .mini-note{margin:4px 0; color:var(--muted); font-size:13.5px;} .mini-src{font-size:13px;}
details{margin-top:12px;} summary{cursor:pointer; font-weight:600; color:var(--accent);}
.tbl-wrap{overflow-x:auto; margin:10px 0;}
.tbl{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px;}
.tbl th,.tbl td{text-align:left; vertical-align:top; padding:9px 10px; border-bottom:1px solid var(--rule);}
.tbl thead th{font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--rule-strong);}
.tbl tbody th{font-weight:500;}
.tbl .num{text-align:right; white-space:nowrap;} .facts td.num{white-space:normal; min-width:9em;}
.eval td{min-width:0;} .eval td:nth-child(3){min-width:18em;}
.mono{font-family:var(--f-mono); font-size:12.5px;} .nowrap{white-space:nowrap;} .muted{color:var(--muted);} .small{font-size:13px;}
.linkish{font:inherit; color:var(--ink); background:none; border:0; padding:0; text-align:left; cursor:pointer; text-decoration:underline; text-decoration-color:var(--rule-strong); text-underline-offset:3px;}
.linkish:hover{color:var(--accent);}
.seg{display:inline-flex; flex-wrap:wrap; gap:6px; margin-bottom:18px;}
.seg button{font:500 13.5px var(--f-body); border:1px solid var(--rule-strong); background:var(--surface); color:var(--ink); padding:7px 14px; border-radius:999px; cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink);}
.sec-h h2{font-family:var(--f-display); font-size:26px; font-weight:600; margin:0 0 2px; text-wrap:balance;} .sec-h p{margin:0 0 8px;}
.h3{font-family:var(--f-display); font-size:18px; font-weight:600; margin:26px 0 6px;}
.cell-flag{margin-top:6px; font-size:13px; color:var(--warn);}
.brief-bar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:16px;} .brief-bar .seg{margin:0;}
.brief{background:var(--surface); border:1px solid var(--rule); border-radius:4px; padding:28px clamp(16px, 4vw, 40px); max-width:780px;}
.brief-h{font-family:var(--f-display); font-size:30px; font-weight:600; margin:6px 0 4px;}
.brief-asof{color:var(--muted); margin:0 0 6px; padding-bottom:14px; border-bottom:1px solid var(--rule);}
.b-sec{margin:18px 0;} .b-sec h3{font-family:var(--f-display); font-size:17px; font-weight:600; margin:0 0 6px;} .b-sec p{margin:0 0 8px; max-width:68ch;} .b-note{color:var(--muted); font-size:14px;} .b-flag{background:var(--warn-soft); padding:8px 10px; border-radius:6px; font-size:14px;}
.list{margin:0; padding-left:20px;} .list li{margin:4px 0;}
.eval-sum{font-size:17px; margin:0 0 6px;}
.ok-t{color:var(--ok); font-weight:600;} .bad-t{color:var(--stop); font-weight:600;}
.typechip{font:600 11.5px var(--f-body); padding:2px 8px; border-radius:999px; background:var(--old-soft); color:var(--old); white-space:nowrap;}
.typechip.t1,.typechip.t3{background:var(--warn-soft); color:var(--warn);} .typechip.t4{background:var(--calc-soft); color:var(--calc);} .typechip.t5{background:var(--stop-soft); color:var(--stop);}
.prose{max-width:70ch;} .prose h3{font-family:var(--f-display); font-size:18px; font-weight:600; margin:24px 0 6px;} .prose p{margin:6px 0;}
.foot{border-top:1px solid var(--rule); background:var(--surface); color:var(--muted); font-size:13px;}
.foot .wrap{padding-block:18px 24px; display:flex; flex-wrap:wrap; gap:6px 18px; align-items:center;}
.clefs{font-family:"Noto Music", "Segoe UI Symbol", "Apple Symbols", serif; font-size:19px; color:var(--ink); letter-spacing:1px;}
@media (max-width:560px){ .lead{font-size:16px;} .answer{padding:18px 16px;} .tbl{font-size:13.5px;} .brief-h{font-size:26px;} }
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important; transition:none !important;} }
</style>
