<title>Emergency Knowledge Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Music&family=Noto+Sans+Mono:wght@500&family=Noto+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* Layout: cyan title band, white tab bar with a cyan underline, grey intro strip, then white cards on a light grey page (max 1120px); cyan footer */
  --band:#0099D8; --band-ink:#FFFFFF; --cyan:#1CABE2; --cyan-soft:#E3F4FB;
  --paper:#F2F2F2; --surface:#FFFFFF; --ink:#1F2328; --muted:#5A6068; --rule:#DCDFE3; --rule-strong:#B4BAC1;
  --accent:#0068B3; --accent-ink:#FFFFFF; --accent-soft:#E2EEF8;
  --foot-ink:#0B2235;
  --ok:#1D7044; --ok-soft:#E1F1E7; --warn:#835400; --warn-soft:#FAEFD6; --old:#5A6068; --old-soft:#ECEEF0; --calc:#45479C; --calc-soft:#E7E7F7; --stop:#B3261E; --stop-soft:#FBE5E2;
  --bar-fill:#1CABE2; --bar-gap:#DCE6EC;
  --shadow:0 1px 2px rgba(16, 24, 32, .08), 0 2px 8px rgba(16, 24, 32, .06);
  --f-body:"Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"Noto Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --band:#00699A; --band-ink:#FFFFFF; --cyan:#3BBCEC; --cyan-soft:#0E2C3B;
  --paper:#101418; --surface:#1A1F25; --ink:#E8EBEE; --muted:#A3ABB4; --rule:#2B323A; --rule-strong:#3E4750;
  --accent:#5DB8F0; --accent-ink:#06192A; --accent-soft:#132E44;
  --foot-ink:#04121D;
  --ok:#6FC497; --ok-soft:#14301F; --warn:#E5B456; --warn-soft:#33270C; --old:#A3ABB4; --old-soft:#242A31; --calc:#A9ABF2; --calc-soft:#23264D; --stop:#F2958B; --stop-soft:#3A1C19;
  --bar-fill:#3BBCEC; --bar-gap:#2A3540;
  --shadow:0 1px 2px rgba(0, 0, 0, .4);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --band:#00699A; --band-ink:#FFFFFF; --cyan:#3BBCEC; --cyan-soft:#0E2C3B;
  --paper:#101418; --surface:#1A1F25; --ink:#E8EBEE; --muted:#A3ABB4; --rule:#2B323A; --rule-strong:#3E4750;
  --accent:#5DB8F0; --accent-ink:#06192A; --accent-soft:#132E44;
  --foot-ink:#04121D;
  --ok:#6FC497; --ok-soft:#14301F; --warn:#E5B456; --warn-soft:#33270C; --old:#A3ABB4; --old-soft:#242A31; --calc:#A9ABF2; --calc-soft:#23264D; --stop:#F2958B; --stop-soft:#3A1C19;
  --bar-fill:#3BBCEC; --bar-gap:#2A3540;
  --shadow:0 1px 2px rgba(0, 0, 0, .4);
  color-scheme:dark; }
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--band);}
.wrap{max-width:1120px; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px;}
h1,h2,h3{text-wrap:balance;}

/* Title band */
.band{background:var(--band); color:var(--band-ink);}
.band :focus-visible{outline-color:var(--band-ink);}
.band-in{padding-block:30px; display:flex; flex-wrap:wrap; gap:10px 20px; align-items:center; justify-content:space-between;}
h1{font-weight:800; font-size:clamp(28px, 4.4vw, 44px); line-height:1.1; margin:0; letter-spacing:-0.01em;}
.badge{font:700 13px var(--f-body); color:var(--foot-ink); background:var(--band-ink); border-radius:4px; padding:7px 14px; white-space:nowrap;}

/* Tab bar */
.navbar{background:var(--surface); border-bottom:1px solid var(--cyan);}
.tabs{display:flex; gap:8px 28px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{font:700 16px var(--f-body); color:var(--ink); background:none; border:0; border-bottom:4px solid transparent; padding:16px 0 12px; cursor:pointer; white-space:nowrap;}
.tab:hover{border-bottom-color:var(--rule-strong);}
.tab[aria-selected="true"]{border-bottom-color:var(--cyan);}

/* Intro strip */
.intro{background:var(--surface); border-bottom:1px solid var(--rule);}
.intro-in{padding-block:18px; display:flex; flex-wrap:wrap; gap:12px 40px; align-items:center; justify-content:space-between;}
.tag{margin:0; color:var(--ink); max-width:62ch; font-size:16px; min-width:0; flex:1 1 420px;}
.band-meta{display:flex; flex-wrap:wrap; gap:8px 28px; margin:0;}
.band-meta div{min-width:0;}
.band-meta dt{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted);}
.band-meta dd{margin:2px 0 0; font-family:var(--f-mono); font-size:13px;}

main{padding-block:32px 64px;}
.eyebrow{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin:0;}
.lbl{display:block; font-weight:700; margin-bottom:12px; font-size:20px;}
.ask{background:var(--surface); box-shadow:var(--shadow); border-radius:4px; padding:24px clamp(16px, 3vw, 28px) 20px; margin-bottom:24px;}
.ask-row{display:flex; gap:8px; flex-wrap:wrap;}
#q{flex:1 1 340px; min-width:0; font:inherit; font-size:16px; padding:13px 14px; border:1px solid var(--rule-strong); border-radius:4px; background:var(--surface); color:var(--ink);}
#q:focus{border-color:var(--cyan); outline:none; box-shadow:0 0 0 3px var(--cyan-soft);}
.btn{font:700 15px var(--f-body); background:var(--accent); color:var(--accent-ink); border:0; border-radius:4px; padding:13px 22px; cursor:pointer;}
.btn:hover{filter:brightness(1.1);}
.btn.ghost{background:var(--surface); color:var(--accent); border:2px solid var(--accent); padding:7px 14px; font-size:14px;}
.chips-wrap{display:flex; gap:12px; align-items:baseline; margin-top:16px;}
.chips-k{font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); flex:none;}
.chips{display:flex; flex-wrap:wrap; gap:8px; min-width:0;}
.chips button{font:600 13px var(--f-body); color:var(--accent); background:var(--surface); border:1px solid var(--accent); border-radius:999px; padding:5px 12px; cursor:pointer;}
.chips button:hover{background:var(--accent); color:var(--accent-ink);}

/* Answer */
.answer{background:var(--surface); box-shadow:var(--shadow); border-radius:4px; overflow:hidden; max-width:880px;}
.ans-top{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; padding:12px clamp(16px, 3vw, 28px); background:var(--old-soft);}
.ans-top.ok{background:var(--ok-soft);} .ans-top.warn{background:var(--warn-soft);} .ans-top.calc{background:var(--calc-soft);} .ans-top.stop{background:var(--stop-soft);}
.ans-k{font:800 12px var(--f-body); letter-spacing:.08em; text-transform:uppercase; color:var(--old);}
.ans-top.ok .ans-k{color:var(--ok);} .ans-top.warn .ans-k{color:var(--warn);} .ans-top.calc .ans-k{color:var(--calc);} .ans-top.stop .ans-k{color:var(--stop);}
.q-echo{color:var(--ink); font-size:14px; min-width:0;}
.ans-body{padding:22px clamp(16px, 3vw, 28px) 24px;}
.ans-title{font-weight:800; font-size:24px; line-height:1.2; margin:0 0 8px;}
.lead{font-size:18px; line-height:1.5; margin:4px 0 14px; max-width:64ch;}
.body{margin:4px 0 12px; max-width:68ch;}
.premise{border-left:4px solid var(--warn); background:var(--warn-soft); padding:10px 14px; margin:0 0 16px; max-width:70ch;}
.pill{display:inline-flex; align-items:center; font:700 12px var(--f-body); padding:2px 9px; border-radius:999px; white-space:nowrap;}
.pill.ok{background:var(--ok-soft); color:var(--ok);} .pill.warn{background:var(--warn-soft); color:var(--warn);} .pill.old{background:var(--old-soft); color:var(--old);} .pill.calc{background:var(--calc-soft); color:var(--calc);} .pill.stop{background:var(--stop-soft); color:var(--stop);}
.meta{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px 24px; margin:16px 0; padding:14px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);}
.meta div{min-width:0;} .meta dt{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;} .meta dd{margin:0;}
.src{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;} .loc{color:var(--muted); font-size:13px;}
.ref{font-family:var(--f-mono); font-size:11.5px; font-weight:500; background:var(--cyan-soft); color:var(--accent); padding:1px 6px; border-radius:3px; text-decoration:none; white-space:nowrap;}
a.ref:hover, a.plain:hover{text-decoration:underline;} a.plain{color:var(--accent); text-decoration:none; font-weight:600;}
.note,.flag,.calc-note{margin:10px 0; padding:10px 14px; border-radius:4px; max-width:72ch;}
.note{background:var(--paper);} .flag{background:var(--warn-soft);} .calc-note{background:var(--calc-soft);}
.note-k{display:block; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:2px;}
.flag .note-k{color:var(--warn);} .calc-note .note-k{color:var(--calc);}
.mini{border:1px solid var(--rule); border-radius:4px; padding:10px 14px; margin:10px 0; background:var(--paper);}
.mini-h{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:4px;} .asof{font-size:13px; color:var(--muted);} .mini-t{margin:4px 0;} .mini-note{margin:4px 0; color:var(--muted); font-size:13.5px;} .mini-src{font-size:13px;}
details{margin-top:12px;} summary{cursor:pointer; font-weight:700; color:var(--accent);}

/* Tables */
.tbl-wrap{overflow-x:auto; margin:10px 0; background:var(--surface);}
.tbl{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px;}
.tbl th,.tbl td{text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid var(--rule);}
.tbl thead th{font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--ink); background:var(--cyan-soft); border-bottom:2px solid var(--cyan);}
.tbl tbody th{font-weight:700;}
.tbl .num{text-align:right; white-space:nowrap;} .facts td.num{white-space:normal; min-width:9em;}
.answer .tbl-wrap, .brief .tbl-wrap{background:transparent;}
.eval td{min-width:0;} .eval td:nth-child(3){min-width:18em;}
.mono{font-family:var(--f-mono); font-size:12px;} .nowrap{white-space:nowrap;} .muted{color:var(--muted);} .small{font-size:13px;}
.linkish{font:inherit; color:var(--ink); background:none; border:0; padding:0; text-align:left; cursor:pointer; text-decoration:underline; text-decoration-color:var(--rule-strong); text-underline-offset:3px;}
.linkish:hover{color:var(--accent);}

/* Segmented controls */
.seg{display:inline-flex; flex-wrap:wrap; gap:8px; margin-bottom:24px;}
.seg button{font:700 14px var(--f-body); border:2px solid var(--accent); background:var(--surface); color:var(--accent); padding:7px 16px; border-radius:4px; cursor:pointer;}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}

/* Section heads */
.sec-h h2{font-size:32px; font-weight:800; line-height:1.15; margin:0 0 4px;} .sec-h p{margin:0 0 8px;}
.h3{font-size:20px; font-weight:800; margin:36px 0 8px;}
.cell-flag{margin-top:6px; font-size:13px; color:var(--warn);}

/* Situation in numbers */
.sin{margin:20px 0 8px; background:var(--surface); box-shadow:var(--shadow); border-top:6px solid var(--cyan); border-radius:0 0 4px 4px; padding:18px clamp(16px, 3vw, 28px) 22px;}
.sin-h{display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
.sin-h h3{font-size:18px; font-weight:800; margin:0;}
.figs{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:18px 24px;}
.fig{min-width:0; padding-left:14px; border-left:3px solid var(--cyan);}
.fig-v{font-weight:800; font-size:clamp(28px, 3.4vw, 36px); line-height:1.05; color:var(--accent); font-variant-numeric:tabular-nums; letter-spacing:-0.01em;}
.fig-l{margin:6px 0 4px; font-weight:600; font-size:14px; line-height:1.35;}
.fig-s{font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center;}
.fund{margin-top:22px; padding-top:16px; border-top:1px solid var(--rule);}
.fund-h{display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:space-between; align-items:baseline; font-size:14px; margin-bottom:8px;}
.fund-h strong{font-weight:700;}
.bar{display:flex; height:16px; border-radius:2px; overflow:hidden; background:var(--bar-gap);}
.bar span{display:block; background:var(--bar-fill);}
.bar-legend{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 16px; margin-top:6px; font-size:13px; font-variant-numeric:tabular-nums;}
.bar-legend .k{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px;}
.k-fill{background:var(--bar-fill);} .k-gap{background:var(--bar-gap); box-shadow:inset 0 0 0 1px var(--rule-strong);}

/* Brief */
.brief-bar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:18px;} .brief-bar .seg{margin:0;}
.brief{background:var(--surface); box-shadow:var(--shadow); border-top:6px solid var(--cyan); padding:28px clamp(16px, 4vw, 44px) 32px; max-width:820px;}
.brief-top{display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:space-between; align-items:baseline;}
.stamp{font:800 11px var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--stop); border:2px solid var(--stop); border-radius:3px; padding:3px 8px; white-space:nowrap;}
.brief-h{font-size:34px; font-weight:800; line-height:1.1; margin:10px 0 6px;}
.brief-asof{color:var(--muted); margin:0 0 6px; padding-bottom:16px; border-bottom:1px solid var(--rule);}
.b-sec{margin:20px 0; display:grid; grid-template-columns:minmax(0, 170px) minmax(0, 1fr); gap:4px 24px;}
.b-sec > h3{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin:3px 0 0;}
.b-sec > div{min-width:0;}
.b-sec p{margin:0 0 8px; max-width:66ch;} .b-note{color:var(--muted); font-size:14px;} .b-flag{background:var(--warn-soft); padding:8px 12px; border-radius:4px; font-size:14px;}
.list{margin:0; padding-left:20px;} .list li{margin:4px 0;}
.todo{margin:22px 0 8px; background:var(--cyan-soft); border-radius:4px; padding:16px clamp(14px, 3vw, 22px) 18px;}
.todo-h{font-size:17px; font-weight:800; margin:0 0 10px;}
.todo-grid{display:grid; grid-template-columns:repeat(2, minmax(0, 1fr)); gap:16px 28px;}
.todo-col{min-width:0; font-size:14px;}
.todo-col h4{font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--accent); margin:0 0 4px;}
.todo-col p{margin:0 0 4px;} .todo-sub{color:var(--muted); font-size:13px;}
.part{margin:18px 0 0; padding-top:16px; border-top:2px solid var(--cyan);}
.part-h{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; margin-bottom:8px;}
.part-h h3{font-size:20px; font-weight:800; margin:0;}

/* Evaluation */
.scores{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin:20px 0 8px;}
.score{background:var(--surface); box-shadow:var(--shadow); border-top:6px solid var(--cyan); border-radius:0 0 4px 4px; padding:16px 18px;}
.score-v{font-weight:800; font-size:44px; line-height:1; font-variant-numeric:tabular-nums;}
.score-v small{font-size:22px; color:var(--muted); font-weight:700;}
.score-l{margin-top:8px; font-size:14px; color:var(--muted);}
.score.ok .score-v{color:var(--ok);} .score.bad .score-v{color:var(--stop);}
.ok-t{color:var(--ok); font-weight:700;} .bad-t{color:var(--stop); font-weight:700;}
.typechip{font:700 11.5px var(--f-body); padding:2px 8px; border-radius:999px; background:var(--old-soft); color:var(--old); white-space:nowrap;}
.typechip.t1,.typechip.t3{background:var(--warn-soft); color:var(--warn);} .typechip.t4{background:var(--calc-soft); color:var(--calc);} .typechip.t5{background:var(--stop-soft); color:var(--stop);}

.prose{max-width:70ch;} .prose h3{font-size:20px; font-weight:800; margin:28px 0 6px;} .prose p{margin:6px 0;}
.foot{background:var(--cyan); color:var(--foot-ink); font-size:13px;}
.foot .wrap{padding-block:28px 32px; display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center; justify-content:space-between;}
.foot-name{font-weight:700;}
.clefs{font-family:"Noto Music", "Segoe UI Symbol", "Apple Symbols", serif; font-size:19px; letter-spacing:1px; font-weight:400;}
@media (max-width:640px){
  .band-in{padding-block:20px;}
  .tabs{gap:8px 20px;} .tab{font-size:15px;}
  .lead{font-size:16.5px;} .tbl{font-size:13.5px;} .brief-h{font-size:28px;} .sec-h h2{font-size:28px;}
  .b-sec{grid-template-columns:minmax(0, 1fr);}
  .todo-grid{grid-template-columns:minmax(0, 1fr);}
  .chips-wrap{flex-direction:column; gap:8px;}
  .btn{flex:1 1 auto;}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important; transition:none !important;} }
</style>
