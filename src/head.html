<title>Emergency Knowledge Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Noto+Music&family=Noto+Sans+Mono:wght@500&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: a deep-blue situation-report band carries the title and tabs; one reading column (max 1120px) below; the answer and the brief are the only framed objects */
  --band:#0B4F8C; --band-ink:#FFFFFF; --band-muted:#C7DBEE; --band-line:#2F6CA3;
  --paper:#F3F6F9; --surface:#FFFFFF; --ink:#11263B; --muted:#4F6378; --rule:#D3DEE8; --rule-strong:#AFC1D1;
  --accent:#0B5FA8; --accent-ink:#FFFFFF; --accent-soft:#E3EEF8;
  --ok:#1D7044; --ok-soft:#E1F1E7; --warn:#835400; --warn-soft:#FAEFD6; --old:#56677A; --old-soft:#E7ECF1; --calc:#45479C; --calc-soft:#E7E7F7; --stop:#A0362B; --stop-soft:#F8E4E1;
  --bar-fill:#0B5FA8; --bar-gap:#DCE5EE;
  --f-display:"Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --f-body:"Noto Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"Noto Sans Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --band:#0C2A47; --band-ink:#F2F7FC; --band-muted:#A9C2DA; --band-line:#1F4468;
  --paper:#0B1621; --surface:#12212F; --ink:#E3ECF4; --muted:#9BB0C4; --rule:#213547; --rule-strong:#334B61;
  --accent:#62A9EA; --accent-ink:#071624; --accent-soft:#16304A;
  --ok:#6FC497; --ok-soft:#14301F; --warn:#E5B456; --warn-soft:#33270C; --old:#A3B2C1; --old-soft:#1F2D3A; --calc:#A9ABF2; --calc-soft:#23264D; --stop:#F0958A; --stop-soft:#3A1C19;
  --bar-fill:#62A9EA; --bar-gap:#22374B;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --band:#0C2A47; --band-ink:#F2F7FC; --band-muted:#A9C2DA; --band-line:#1F4468;
  --paper:#0B1621; --surface:#12212F; --ink:#E3ECF4; --muted:#9BB0C4; --rule:#213547; --rule-strong:#334B61;
  --accent:#62A9EA; --accent-ink:#071624; --accent-soft:#16304A;
  --ok:#6FC497; --ok-soft:#14301F; --warn:#E5B456; --warn-soft:#33270C; --old:#A3B2C1; --old-soft:#1F2D3A; --calc:#A9ABF2; --calc-soft:#23264D; --stop:#F0958A; --stop-soft:#3A1C19;
  --bar-fill:#62A9EA; --bar-gap:#22374B;
  color-scheme:dark; }
body{background:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.6;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:10; background:var(--band);}
.wrap{max-width:1120px; margin-inline:auto; padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px;}

/* Band */
.band{background:var(--band); color:var(--band-ink);}
.band :focus-visible{outline-color:var(--band-ink);}
.band-in{padding-block:36px 26px; display:flex; flex-wrap:wrap; gap:20px 40px; align-items:flex-end; justify-content:space-between;}
.brand{min-width:0; flex:1 1 620px;}
h1{font-family:var(--f-display); font-weight:700; font-size:clamp(34px, 5.4vw, 54px); line-height:1; margin:10px 0 12px; text-wrap:balance; letter-spacing:-0.005em;}
.eyebrow{font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0;}
.band-eyebrow{color:var(--band-muted);}
.tag{margin:0; color:var(--band-muted); max-width:60ch; font-size:16px;}
.band-meta{display:flex; flex-wrap:wrap; gap:10px 28px; margin:0; padding-left:18px; border-left:1px solid var(--band-line);}
.band-meta div{min-width:0;}
.band-meta dt{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--band-muted);}
.band-meta dd{margin:2px 0 0; font-family:var(--f-mono); font-size:13px; color:var(--band-ink);}
.tabs{display:flex; gap:4px; overflow-x:auto; scrollbar-width:none;}
.tabs::-webkit-scrollbar{display:none;}
.tab{font:600 14px var(--f-body); color:var(--band-muted); background:none; border:0; border-radius:6px 6px 0 0; padding:12px 16px 11px; cursor:pointer; white-space:nowrap;}
.tab:hover{color:var(--band-ink);}
.tab[aria-selected="true"]{background:var(--paper); color:var(--ink);}

main{padding-block:28px 56px;}
.lbl{display:block; font-weight:600; margin-bottom:10px; font-size:16px;}
.ask{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:20px clamp(16px, 3vw, 24px) 16px; margin-bottom:22px;}
.ask-row{display:flex; gap:8px; flex-wrap:wrap;}
#q{flex:1 1 340px; min-width:0; font:inherit; font-size:16px; padding:13px 14px; border:1px solid var(--rule-strong); border-radius:6px; background:var(--paper); color:var(--ink);}
#q:focus{border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft);}
.btn{font:600 15px var(--f-body); background:var(--accent); color:var(--accent-ink); border:0; border-radius:6px; padding:13px 20px; cursor:pointer;}
.btn:hover{filter:brightness(1.08);}
.btn.ghost{background:transparent; color:var(--accent); border:1px solid var(--accent); padding:8px 14px; font-size:14px;}
.chips-wrap{display:flex; gap:10px; align-items:baseline; margin-top:14px;}
.chips-k{font-size:11.5px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); flex:none;}
.chips{display:flex; flex-wrap:wrap; gap:6px 8px; min-width:0;}
.chips button{font:500 13px var(--f-body); color:var(--accent); background:var(--accent-soft); border:0; border-radius:4px; padding:5px 10px; cursor:pointer;}
.chips button:hover{text-decoration:underline; text-underline-offset:3px;}

/* Answer */
.answer{background:var(--surface); border:1px solid var(--rule); border-radius:10px; overflow:hidden; max-width:860px;}
.ans-top{display:flex; flex-wrap:wrap; gap:6px 12px; align-items:baseline; padding:12px clamp(16px, 3vw, 28px); background:var(--old-soft);}
.ans-top.ok{background:var(--ok-soft);} .ans-top.warn{background:var(--warn-soft);} .ans-top.calc{background:var(--calc-soft);} .ans-top.stop{background:var(--stop-soft);}
.ans-k{font:700 12px var(--f-body); letter-spacing:.1em; text-transform:uppercase; color:var(--old);}
.ans-top.ok .ans-k{color:var(--ok);} .ans-top.warn .ans-k{color:var(--warn);} .ans-top.calc .ans-k{color:var(--calc);} .ans-top.stop .ans-k{color:var(--stop);}
.q-echo{color:var(--ink); font-size:14px; min-width:0;}
.ans-body{padding:20px clamp(16px, 3vw, 28px) 22px;}
.ans-title{font-family:var(--f-display); font-weight:700; font-size:26px; line-height:1.15; margin:0 0 8px; text-wrap:balance;}
.lead{font-size:18px; line-height:1.5; margin:4px 0 14px; max-width:64ch;}
.body{margin:4px 0 12px; max-width:68ch;}
.premise{border:1px solid var(--warn); border-radius:6px; padding:10px 14px; margin:0 0 16px; max-width:70ch;}
.pill{display:inline-flex; align-items:center; font:600 12px var(--f-body); padding:2px 9px; border-radius:4px; white-space:nowrap;}
.pill.ok{background:var(--ok-soft); color:var(--ok);} .pill.warn{background:var(--warn-soft); color:var(--warn);} .pill.old{background:var(--old-soft); color:var(--old);} .pill.calc{background:var(--calc-soft); color:var(--calc);} .pill.stop{background:var(--stop-soft); color:var(--stop);}
.meta{display:grid; grid-template-columns:repeat(auto-fit, minmax(170px, 1fr)); gap:12px 24px; margin:16px 0; padding:14px 0; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);}
.meta div{min-width:0;} .meta dt{font-size:11px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:4px;} .meta dd{margin:0;}
.src{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap;} .loc{color:var(--muted); font-size:13px;}
.ref{font-family:var(--f-mono); font-size:11.5px; font-weight:500; background:var(--accent-soft); color:var(--accent); padding:1px 6px; border-radius:3px; text-decoration:none; white-space:nowrap;}
a.ref:hover, a.plain:hover{text-decoration:underline;} a.plain{color:var(--ink); text-decoration:none;}
.note,.flag,.calc-note{margin:10px 0; padding:10px 14px; border-radius:6px; max-width:72ch;}
.note{background:var(--paper);} .flag{background:var(--warn-soft);} .calc-note{background:var(--calc-soft);}
.note-k{display:block; font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:2px;}
.flag .note-k{color:var(--warn);} .calc-note .note-k{color:var(--calc);}
.mini{border:1px solid var(--rule); border-radius:6px; padding:10px 14px; margin:10px 0; background:var(--paper);}
.mini-h{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:4px;} .asof{font-size:13px; color:var(--muted);} .mini-t{margin:4px 0;} .mini-note{margin:4px 0; color:var(--muted); font-size:13.5px;} .mini-src{font-size:13px;}
details{margin-top:12px;} summary{cursor:pointer; font-weight:600; color:var(--accent);}

/* Tables */
.tbl-wrap{overflow-x:auto; margin:10px 0;}
.tbl{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; font-size:14px;}
.tbl th,.tbl td{text-align:left; vertical-align:top; padding:10px 12px; border-bottom:1px solid var(--rule);}
.tbl thead th{font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); border-bottom:2px solid var(--ink);}
.tbl tbody th{font-weight:600;}
.tbl .num{text-align:right; white-space:nowrap;} .facts td.num{white-space:normal; min-width:9em;}
.eval td{min-width:0;} .eval td:nth-child(3){min-width:18em;}
.mono{font-family:var(--f-mono); font-size:12px;} .nowrap{white-space:nowrap;} .muted{color:var(--muted);} .small{font-size:13px;}
.linkish{font:inherit; color:var(--ink); background:none; border:0; padding:0; text-align:left; cursor:pointer; text-decoration:underline; text-decoration-color:var(--rule-strong); text-underline-offset:3px;}
.linkish:hover{color:var(--accent);}

/* Segmented controls */
.seg{display:inline-flex; flex-wrap:wrap; gap:0; margin-bottom:22px; border:1px solid var(--rule-strong); border-radius:6px; overflow:hidden; background:var(--surface);}
.seg button{font:600 13.5px var(--f-body); border:0; border-left:1px solid var(--rule-strong); background:transparent; color:var(--ink); padding:8px 16px; cursor:pointer;}
.seg button:first-child{border-left:0;}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink);}

/* Section heads */
.sec-h h2{font-family:var(--f-display); font-size:34px; font-weight:700; line-height:1.05; margin:0 0 4px; text-wrap:balance;} .sec-h p{margin:0 0 8px;}
.h3{font-family:var(--f-display); font-size:21px; font-weight:700; margin:34px 0 6px;}
.cell-flag{margin-top:6px; font-size:13px; color:var(--warn);}

/* Situation in numbers */
.sin{margin:18px 0 8px; border-top:4px solid var(--band); background:var(--surface); border-radius:0 0 10px 10px; padding:16px clamp(16px, 3vw, 24px) 20px;}
.sin-h{display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; justify-content:space-between; margin-bottom:12px;}
.sin-h h3{font:700 12px var(--f-body); letter-spacing:.1em; text-transform:uppercase; margin:0; color:var(--ink);}
.figs{display:grid; grid-template-columns:repeat(auto-fit, minmax(190px, 1fr)); gap:18px 24px;}
.fig{min-width:0; padding-left:14px; border-left:1px solid var(--rule);}
.fig-v{font-family:var(--f-display); font-weight:700; font-size:clamp(30px, 3.6vw, 40px); line-height:1; color:var(--accent); font-variant-numeric:tabular-nums;}
.fig-l{margin:6px 0 4px; font-weight:600; font-size:14px; line-height:1.35;}
.fig-s{font-size:12.5px; color:var(--muted); display:flex; flex-wrap:wrap; gap:4px 8px; align-items:center;}
.fund{margin-top:20px; padding-top:16px; border-top:1px solid var(--rule);}
.fund-h{display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:space-between; align-items:baseline; font-size:14px; margin-bottom:8px;}
.fund-h strong{font-weight:600;}
.bar{display:flex; height:14px; border-radius:3px; overflow:hidden; background:var(--bar-gap);}
.bar span{display:block; background:var(--bar-fill);}
.bar-legend{display:flex; flex-wrap:wrap; justify-content:space-between; gap:4px 16px; margin-top:6px; font-size:13px; font-variant-numeric:tabular-nums;}
.bar-legend .k{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px;}
.k-fill{background:var(--bar-fill);} .k-gap{background:var(--bar-gap); box-shadow:inset 0 0 0 1px var(--rule-strong);}

/* Brief */
.brief-bar{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; margin-bottom:18px;} .brief-bar .seg{margin:0;}
.brief{background:var(--surface); border:1px solid var(--rule); border-top:4px solid var(--band); padding:28px clamp(16px, 4vw, 44px) 32px; max-width:800px;}
.brief-top{display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:space-between; align-items:baseline;}
.stamp{font:700 11px var(--f-body); letter-spacing:.12em; text-transform:uppercase; color:var(--stop); border:1.5px solid var(--stop); border-radius:3px; padding:3px 8px; white-space:nowrap;}
.brief-h{font-family:var(--f-display); font-size:38px; font-weight:700; line-height:1.05; margin:10px 0 6px;}
.brief-asof{color:var(--muted); margin:0 0 6px; padding-bottom:16px; border-bottom:1px solid var(--rule);}
.b-sec{margin:20px 0; display:grid; grid-template-columns:minmax(0, 170px) minmax(0, 1fr); gap:4px 24px;}
.b-sec > h3{font-family:var(--f-body); font-size:12px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin:3px 0 0;}
.b-sec > div{min-width:0;}
.b-sec p{margin:0 0 8px; max-width:66ch;} .b-note{color:var(--muted); font-size:14px;} .b-flag{background:var(--warn-soft); padding:8px 12px; border-radius:6px; font-size:14px;}
.list{margin:0; padding-left:20px;} .list li{margin:4px 0;}

/* Evaluation */
.scores{display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:16px; margin:18px 0 6px;}
.score{background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:16px 18px;}
.score-v{font-family:var(--f-display); font-weight:700; font-size:44px; line-height:1; font-variant-numeric:tabular-nums;}
.score-v small{font-size:24px; color:var(--muted); font-weight:600;}
.score-l{margin-top:6px; font-size:14px; color:var(--muted);}
.score.ok .score-v{color:var(--ok);} .score.bad .score-v{color:var(--stop);}
.ok-t{color:var(--ok); font-weight:600;} .bad-t{color:var(--stop); font-weight:600;}
.typechip{font:600 11.5px var(--f-body); padding:2px 8px; border-radius:4px; background:var(--old-soft); color:var(--old); white-space:nowrap;}
.typechip.t1,.typechip.t3{background:var(--warn-soft); color:var(--warn);} .typechip.t4{background:var(--calc-soft); color:var(--calc);} .typechip.t5{background:var(--stop-soft); color:var(--stop);}

.prose{max-width:70ch;} .prose h3{font-family:var(--f-display); font-size:21px; font-weight:700; margin:28px 0 6px;} .prose p{margin:6px 0;}
.foot{background:var(--band); color:var(--band-muted); font-size:13px;}
.foot .wrap{padding-block:20px 26px; display:flex; flex-wrap:wrap; gap:6px 20px; align-items:center; justify-content:space-between;}
.foot .wrap > span:first-child{color:var(--band-ink); font-weight:600;}
.clefs{font-family:"Noto Music", "Segoe UI Symbol", "Apple Symbols", serif; font-size:19px; letter-spacing:1px; font-weight:400;}
@media (max-width:640px){
  .band-in{padding-block:26px 18px;}
  .band-meta{padding-left:0; border-left:0;}
  .lead{font-size:16.5px;} .tbl{font-size:13.5px;} .brief-h{font-size:30px;}
  .b-sec{grid-template-columns:minmax(0, 1fr);}
  .chips-wrap{flex-direction:column; gap:6px;}
  .btn{flex:1 1 auto;}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important; transition:none !important;} }
</style>
